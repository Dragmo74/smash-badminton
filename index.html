<title>Smash Badminton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Smash : tournois de badminton à la mêlée ou en équipes fixes, tirage des équipes, scores, classements et finales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky title bar, one centred column (max 760px) of match cards drawn as real 13,40 × 6,10 m courts; tab bar fixed to the bottom on phones, under the header on wide screens */
:root {
  --bg: #EBF0EA;
  --surface: #FFFFFF;
  --surface-2: #F3F6F1;
  --ink: #14201A;
  --muted: #58685F;
  --rule: #D1DACF;
  --link: #1D6A4D;
  --court: #2B7255;
  --court-deep: #215C45;
  --court-line: rgba(255, 255, 255, .88);
  --court-ink: #FFFFFF;
  --alley-dim: rgba(0, 0, 0, .2);
  --shuttle: #F2C230;
  --shuttle-deep: #A87A00;
  --shuttle-ink: #2A2000;
  --score-bg: #FFFFFF;
  --score-ink: #14201A;
  --men: #2F5496;
  --women: #7A35A8;
  --ok: #2B7A4B;
  --warn: #9A5410;
  --danger: #B42318;
  --on-danger: #FFFFFF;
  --focus: #1F5FD0;
  --scrim: rgba(12, 20, 16, .45);
  --toast-bg: #14201A;
  --toast-ink: #FFFFFF;
  --toast-action: #F2C230;
  --shadow: 0 1px 2px rgba(20, 33, 27, .08), 0 6px 18px rgba(20, 33, 27, .08);
  --font-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --topbar-h: 57px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1411; --surface: #151F1A; --surface-2: #1B2821; --ink: #E3EBE5; --muted: #9AA9A1; --rule: #2A3832; --link: #7DD3A9;
    --court: #226148; --court-deep: #1A4B38; --court-line: rgba(255, 255, 255, .8); --court-ink: #FFFFFF; --alley-dim: rgba(0, 0, 0, .25);
    --shuttle: #F2C230; --shuttle-deep: #F2C230; --shuttle-ink: #2A2000; --score-bg: #F3F6F1; --score-ink: #14201A;
    --men: #93B2F2; --women: #CFA2EE; --ok: #5DBF88; --warn: #E8A660; --danger: #F2857A; --on-danger: #2A0A06; --focus: #8EB6FF;
    --scrim: rgba(0, 0, 0, .6); --toast-bg: #E3EBE5; --toast-ink: #14201A; --toast-action: #7A5600;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #151F1A; --surface-2: #1B2821; --ink: #E3EBE5; --muted: #9AA9A1; --rule: #2A3832; --link: #7DD3A9;
  --court: #226148; --court-deep: #1A4B38; --court-line: rgba(255, 255, 255, .8); --court-ink: #FFFFFF; --alley-dim: rgba(0, 0, 0, .25);
  --shuttle: #F2C230; --shuttle-deep: #F2C230; --shuttle-ink: #2A2000; --score-bg: #F3F6F1; --score-ink: #14201A;
  --men: #93B2F2; --women: #CFA2EE; --ok: #5DBF88; --warn: #E8A660; --danger: #F2857A; --on-danger: #2A0A06; --focus: #8EB6FF;
  --scrim: rgba(0, 0, 0, .6); --toast-bg: #E3EBE5; --toast-ink: #14201A; --toast-action: #7A5600;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
body.noscroll { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Title bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.topbar .wrap { display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; }
.mark .skirt { fill: var(--shuttle); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.mark .rib { fill: none; stroke: var(--ink); stroke-width: 1.1; stroke-linecap: round; }
.mark .cork { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.brand-name { display: block; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: .9; letter-spacing: .06em; text-transform: uppercase; font-style: italic; }
.brand-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.sync {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 11px;
  border-radius: 999px; border: 1px solid var(--rule);
  background: var(--surface-2); color: var(--muted);
  font-size: 12.5px; font-weight: 700; white-space: nowrap;
}
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="saved"] .dot { background: var(--ok); }
.sync[data-s="saving"] .dot, .sync[data-s="loading"] .dot { background: var(--shuttle); }
.sync[data-s="offline"] .dot, .sync[data-s="error"] .dot { background: var(--warn); }
.icon-btn {
  display: inline-grid; place-items: center;
  width: 40px; height: 40px; flex: none;
  border-radius: 10px; border: 1px solid transparent;
  background: transparent; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .i { width: 22px; height: 22px; }
@media (max-width: 419px) { .brand-sub { display: none; } }
@media (max-width: 359px) { .sync .sync-label { display: none; } }

/* ---------- Tabs ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding-block: 6px; }
.tab[hidden] { display: none; }
@media (max-width: 419px) { .tabs.five .wrap { gap: 2px; } .tabs.five .tab { font-size: 11px; } }
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 700;
}
.tab .i { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] .i { color: var(--link); }
.badge {
  position: absolute; top: 2px; left: calc(50% + 6px);
  min-width: 19px; height: 19px; padding: 0 5px;
  display: grid; place-items: center;
  border-radius: 10px; background: var(--shuttle); color: var(--shuttle-ink);
  font-size: 11px; font-weight: 700; line-height: 1;
}
@media (min-width: 900px) {
  .tabs {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); bottom: auto;
    border-top: 0; border-bottom: 1px solid var(--rule); padding-bottom: 0; z-index: 19;
  }
  .tabs .wrap { display: flex; gap: 6px; }
  .tab { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: 14px; }
  .tab .i { width: 20px; height: 20px; }
  .badge { position: static; }
}

/* ---------- Page ---------- */
.banner-slot { padding-top: 14px; }
main { display: grid; gap: 18px; padding-block: 18px 104px; align-content: start; }
@media (min-width: 900px) { main { padding-block: 24px 56px; } }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.view-head > div { flex: 1 1 240px; min-width: 0; }
.h-display {
  margin: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: .95;
  letter-spacing: .01em; text-transform: uppercase; text-wrap: balance;
}
.h-section {
  margin: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.05;
  letter-spacing: .04em; text-transform: uppercase; text-wrap: balance;
}
.lead { color: var(--muted); margin-top: 6px; max-width: 62ch; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); max-width: 62ch; }
.sexcolor-H { color: var(--men); }
.sexcolor-F { color: var(--women); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.pad { padding: 14px 16px; }

/* ---------- Buttons & fields ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
  font-weight: 700; text-align: center;
}
.btn:hover { background: var(--surface-2); }
.btn .i { width: 18px; height: 18px; }
.btn-primary { background: var(--shuttle); color: var(--shuttle-ink); border-color: transparent; }
.btn-primary:hover { background: var(--shuttle); filter: brightness(.95); }
.btn-court { background: var(--court); color: var(--court-ink); border-color: transparent; }
.btn-court:hover { background: var(--court-deep); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); color: var(--on-danger); border-color: transparent; }
.btn-danger-solid:hover { background: var(--danger); filter: brightness(.95); }
.btn-block { width: 100%; }
.btn-lg { min-height: 52px; font-size: 16.5px; }
.btn-small { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.is-waiting, .btn[aria-disabled="true"] { background: var(--surface-2); color: var(--muted); border-color: var(--rule); filter: none; }
.btn-link {
  background: none; border: 0; padding: 8px 4px; min-height: 40px;
  color: var(--link); font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
}
.btn-link.danger { color: var(--danger); }
.field {
  width: 100%; min-width: 0; min-height: 44px; padding: 0 12px;
  border-radius: 10px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
  font-size: 16px;
}
textarea.field { padding: 10px 12px; min-height: 124px; resize: vertical; line-height: 1.4; }
.field:focus { border-color: var(--focus); outline: 2px solid color-mix(in srgb, var(--focus) 30%, transparent); outline-offset: 0; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--rule); flex: none; }
.seg button {
  min-height: 36px; min-width: 40px; padding: 0 12px;
  border: 0; border-radius: 8px; background: transparent;
  color: var(--muted); font-weight: 700;
}
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button[data-sex="H"][aria-checked="true"] { color: var(--men); }
.seg button[data-sex="F"][aria-checked="true"] { color: var(--women); }
.seg .count { font-weight: 400; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.switch { position: relative; display: inline-flex; align-items: center; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch .track { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--rule); transition: background .15s; }
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  transition: transform .15s;
}
.switch input:checked + .track { background: var(--court); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.switch input:disabled { cursor: default; }

/* ---------- Players ---------- */
.addbar { display: flex; gap: 8px; align-items: center; }
.addbar .field { flex: 1 1 auto; }
.form-msg { margin-top: -8px; font-size: 13.5px; color: var(--warn); }
.paste summary { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer; font-weight: 700; color: var(--link); list-style: none; }
.paste summary::-webkit-details-marker { display: none; }
.paste summary::before { content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; border: 1px solid currentColor; font-size: 14px; line-height: 1; }
.paste[open] summary::before { content: "−"; }
.paste-body { display: grid; gap: 10px; margin-top: 6px; }
.paste-body .btn { justify-self: start; }
.formatbox { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--rule); background: var(--surface-2); }
.formatbox strong { font-size: 16px; }
.pgroup { overflow: hidden; }
.pgroup-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 8px; }
.plist { list-style: none; margin: 0; padding: 0; }
.prow { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--rule); }
.sex { width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; font-weight: 700; font-size: 13px; }
.sex-H { background: color-mix(in srgb, var(--men) 14%, transparent); color: var(--men); }
.sex-F { background: color-mix(in srgb, var(--women) 14%, transparent); color: var(--women); }
.sex:disabled { cursor: default; }
.pname-input {
  flex: 1 1 auto; min-width: 0; min-height: 40px; padding: 0 8px;
  border: 1px solid transparent; border-radius: 8px; background: transparent;
  font-size: 16px; font-weight: 700; color: var(--ink);
}
.pname-input:not([readonly]):hover { border-color: var(--rule); }
.pname-input:focus { border-color: var(--focus); background: var(--surface); outline: none; }
.pmeta { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prow.absent .pname-input { color: var(--muted); font-weight: 400; }
.del-spacer { width: 40px; flex: none; }
.del .i { width: 18px; height: 18px; color: var(--muted); }
.empty { display: grid; gap: 12px; }
.mode-panel { display: grid; gap: 8px; }
.mode-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.seg-wide { display: flex; flex: 1 1 250px; max-width: 380px; }
.seg-wide button { flex: 1 1 0; }

/* ---------- Équipes fixes ---------- */
.team-tools { display: grid; gap: 6px; }
.teams { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
@media (min-width: 600px) { .teams { grid-template-columns: 1fr 1fr; } }
.tcard { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); }
.tno { flex: none; width: 36px; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; text-align: center; color: var(--link); font-variant-numeric: tabular-nums; }
.tcard-off .tno { color: var(--muted); }
.tplayers { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tstat { flex: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.free-box { display: grid; gap: 10px; }
.free-box .btn { justify-self: start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center;
  min-height: 40px; max-width: 100%; padding: 0 13px 0 11px;
  border-radius: 999px; border: 1px solid var(--rule);
  background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: 15px; text-align: left; overflow-wrap: anywhere;
}
.chip .sexdot { flex: none; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--shuttle); color: var(--shuttle-ink); border-color: var(--shuttle-deep); }
.chip.off { color: var(--muted); font-weight: 400; }
.chip-note { margin-left: 6px; font-size: 12px; font-weight: 400; }
.chip-empty { border-style: dashed; background: transparent; color: var(--link); }
.chip:disabled { cursor: default; }

/* ---------- Rounds & courts ---------- */
.round-nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
.round-nav::-webkit-scrollbar { display: none; }
.rchip {
  flex: none; min-width: 44px; height: 38px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.rchip.done::after { content: "✓"; margin-left: 4px; font-family: var(--font-body); font-size: 12px; color: var(--ok); }
.rchip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rchip[aria-current="true"].done::after { color: inherit; }
.round-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.matches { display: grid; gap: 20px; }
@media (min-width: 660px) { .matches { grid-template-columns: 1fr 1fr; } }
.match { display: grid; gap: 6px; min-width: 0; }
.match-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.court-no { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.fmt { font-size: 13px; color: var(--muted); }
.status {
  margin-left: auto; padding: 3px 9px;
  border-radius: 999px; border: 1px solid var(--rule);
  font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap;
}
.status[data-s="done"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.status[data-s="partial"], .status[data-s="tie"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.court {
  position: relative;
  display: block;
  width: 100%; max-width: 100%;
  aspect-ratio: 1420 / 690;
  border-radius: 8px;
  background: var(--court-deep);
  color: var(--court-ink);
}
.court-svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 8px; }
.court-svg .c-floor { fill: var(--court); }
.court-svg .c-alley { fill: transparent; }
.court.is-single .c-alley { fill: var(--alley-dim); }
.court-svg .c-line { fill: none; stroke: var(--court-line); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }

/* Une moitié de terrain par équipe. Chaque partenaire est placé au centre de son carré de service
   (entre la ligne de fond et la ligne de service court, de part et d'autre de la ligne médiane) ;
   les deux scores sont réunis au filet. --nx = centre horizontal du carré dans la moitié (472 / 2 + 40 sur 710 unités) */
.side {
  position: absolute; top: 0; bottom: 0; z-index: 1; width: 50%; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 8px;
}
.side-a { left: 0; --nx: 38.9%; }
.side-b { right: 0; --nx: 61.1%; }
.names {
  display: flex; flex-direction: column; align-items: center; gap: 1px; max-width: 100%; min-width: 0; text-align: center;
  /* halo couleur terrain : les lignes s'effacent derrière les prénoms */
  text-shadow: 0 0 1px var(--court), 0 0 3px var(--court), 0 0 5px var(--court), 0 0 8px var(--court);
}
.pn { font-weight: 700; font-size: 16px; line-height: 1.15; overflow-wrap: anywhere; }
@media (max-width: 380px) { .pn { font-size: 15px; } }
.side > .pn {
  position: absolute; left: var(--nx); top: 29%; transform: translate(-50%, -50%);
  width: max-content; max-width: 56%; text-align: center;
  font-size: 17px;
  text-shadow: 0 0 1px var(--court), 0 0 3px var(--court), 0 0 5px var(--court), 0 0 8px var(--court);
}
.side > .pn-2 { top: 71%; }
.court.is-single .side > .pn-1 { top: 42%; font-size: 19px; }
@media (max-width: 380px) { .side > .pn { font-size: 15.5px; } .court.is-single .side > .pn-1 { font-size: 17px; } }
.seedtag { margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .85; }
.side > .seedtag {
  position: absolute; left: var(--nx); top: 50%; transform: translate(-50%, -50%);
  max-width: 62%; margin: 0; padding: 1px 7px; border-radius: 999px;
  background: var(--court-deep); opacity: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 10.5px; line-height: 1.5;
}
.court.is-single .side > .seedtag { top: 64%; }
.wintag {
  visibility: hidden;
  padding: 1px 7px; border-radius: 4px;
  background: var(--shuttle); color: var(--shuttle-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3;
}
.side > .wintag { position: absolute; left: var(--nx); top: 0; transform: translate(-50%, -50%); white-space: nowrap; }
.wintag.on { visibility: visible; }
.side.win > .pn { color: var(--shuttle); }
.side.lose > .pn, .side.lose > .seedtag, .side.lose .names { opacity: .72; }
.scoreboard {
  position: absolute; left: 50%; top: 50%; z-index: 2; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 3px; padding: 4px;
  border-radius: 12px; background: var(--court-deep);
  box-shadow: 0 0 0 1.5px var(--court-line), 0 4px 10px rgba(0, 0, 0, .25);
}

.score {
  width: 50px; height: 46px; padding: 0;
  border: 0; border-radius: 9px;
  background: var(--score-bg); color: var(--score-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1;
  text-align: center; font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .2);
}

@media (max-width: 380px) { .score { width: 46px; height: 42px; font-size: 27px; } }
.score::placeholder { color: color-mix(in srgb, var(--score-ink) 30%, transparent); }
.score:focus { outline: 3px solid var(--shuttle); outline-offset: 2px; }
.score[readonly] { box-shadow: none; }
.match-msg { font-size: 13px; color: var(--warn); font-weight: 700; }
.match[data-s="bad"] .score, .match[data-s="tie"] .score { box-shadow: 0 0 0 3px var(--shuttle); }

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
"use strict";

/* LOGIC-START */
const DEFAULTS = Object.freeze({
  winPts: 3, lossPts: 0, drawPts: 1, allowDraw: false,
  courts: 0, fillSingles: true,
  partnerWeight: 250, opponentWeight: 35, tries: 4000,
  teamMode: "melee", mixedTeams: false,
  scoreFormat: 21,
  finalFormat: "sexes"
});
/* Formats de finale en mêlée (voir buildFinals) */
const FINAL_FORMATS = ["sexes", "mixte", "general"];
/* Format d'un match : points pour gagner le set → score maximal (2 points d'écart jusqu'au plafond). 0 = libre */
const SCORE_FORMATS = [21, 15, 11, 0];
const SCORE_CAP = { 11: 15, 15: 21, 21: 30 };

function emptyState() {
  return { v: 1, updatedAt: 0, exemple: false, nextId: 1, players: [], teams: [], rounds: [], finals: null, history: [], settings: Object.assign({}, DEFAULTS) };
}

function clampInt(v, lo, hi, def) {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def;
}

function normSettings(s) {
  s = s && typeof s === "object" ? s : {};
  return {
    winPts: clampInt(s.winPts, 0, 20, DEFAULTS.winPts),
    lossPts: clampInt(s.lossPts, 0, 20, DEFAULTS.lossPts),
    drawPts: clampInt(s.drawPts, 0, 20, DEFAULTS.drawPts),
    allowDraw: s.allowDraw === true,
    courts: clampInt(s.courts, 0, 40, DEFAULTS.courts),
    fillSingles: s.fillSingles !== false,
    partnerWeight: clampInt(s.partnerWeight, 0, 100000, DEFAULTS.partnerWeight),
    opponentWeight: clampInt(s.opponentWeight, 0, 100000, DEFAULTS.opponentWeight),
    tries: clampInt(s.tries, 100, 20000, DEFAULTS.tries),
    teamMode: s.teamMode === "fixed" ? "fixed" : "melee",
    mixedTeams: s.mixedTeams === true,
    scoreFormat: SCORE_FORMATS.includes(Number(s.scoreFormat)) && s.scoreFormat !== null && s.scoreFormat !== "" ? Number(s.scoreFormat) : DEFAULTS.scoreFormat,
    finalFormat: FINAL_FORMATS.includes(s.finalFormat) ? s.finalFormat : DEFAULTS.finalFormat
  };
}

function scoreVal(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isInteger(n) && n >= 0 && n <= 99 ? n : null;
}

function idList(a, ok) {
  return Array.isArray(a) ? a.filter(id => typeof id === "string" && ok.has(id)) : [];
}

function strList(a) {
  return Array.isArray(a) ? a.filter(x => typeof x === "string").map(x => x.slice(0, 30)).slice(0, 2) : [];
}

function normFinal(f, ok) {
  if (!f || typeof f !== "object") return null;
  const a = idList(f.a, ok).slice(0, 2), b = idList(f.b, ok).slice(0, 2);
  if (!a.length || a.length !== b.length) return null;
  const seeds = (s, n, def) => Array.isArray(s) && s.length === n ? s.map(x => clampInt(x, 1, 99, 1)) : def;
  return {
    a, b,
    seedA: seeds(f.seedA, a.length, a.length === 2 ? [1, 4] : [1]),
    seedB: seeds(f.seedB, b.length, b.length === 2 ? [2, 3] : [2]),
    sa: scoreVal(f.sa), sb: scoreVal(f.sb)
  };
}

function normTeamFinal(f, ok, tok) {
  if (!f || typeof f !== "object" || !tok.has(f.ta) || !tok.has(f.tb) || f.ta === f.tb) return null;
  const a = idList(f.a, ok).slice(0, 2), b = idList(f.b, ok).slice(0, 2);
  if (!a.length || !b.length) return null;
  return { ta: f.ta, tb: f.tb, a, b, seedA: [1], seedB: [2], sa: scoreVal(f.sa), sb: scoreVal(f.sb) };
}

function normalizeState(raw) {
  const st = emptyState();
  if (!raw || typeof raw !== "object") return st;
  st.updatedAt = Number(raw.updatedAt) || 0;
  st.exemple = raw.exemple === true;
  st.settings = normSettings(raw.settings);
  const seen = new Set();
  st.players = (Array.isArray(raw.players) ? raw.players : [])
    .filter(p => p && typeof p.id === "string" && p.id && !seen.has(p.id) && seen.add(p.id))
    .map(p => ({ id: p.id, name: String(p.name || "?").slice(0, 30), sex: p.sex === "F" ? "F" : "H", active: p.active !== false }));
  const ok = new Set(st.players.map(p => p.id));
  let maxN = 0;
  st.players.forEach(p => { const n = parseInt(p.id.replace(/\D/g, ""), 10); if (n > maxN) maxN = n; });
  st.nextId = Math.max(clampInt(raw.nextId, 1, 1e9, 1), maxN + 1);
  /* Équipes fixes : deux joueurs au plus, chaque joueur dans une seule équipe */
  const inTeam = new Set(), tseen = new Set();
  st.teams = (Array.isArray(raw.teams) ? raw.teams : [])
    .filter(t => t && typeof t.id === "string" && /^t\d{1,4}$/.test(t.id) && !tseen.has(t.id) && tseen.add(t.id))
    .map(t => {
      const p = [];
      idList(t.p, ok).forEach(id => { if (p.length < 2 && !inTeam.has(id)) { inTeam.add(id); p.push(id); } });
      return { id: t.id, p };
    });
  const tok = new Set(st.teams.map(t => t.id));
  st.rounds = (Array.isArray(raw.rounds) ? raw.rounds : [])
    .filter(r => r && typeof r === "object")
    .map((r, i) => {
      const rd = {
        n: i + 1,
        rest: idList(r.rest, ok),
        matches: (Array.isArray(r.matches) ? r.matches : [])
          .filter(m => m && typeof m === "object")
          .map((m, j) => {
            const x = { court: clampInt(m.court, 1, 99, j + 1), a: idList(m.a, ok).slice(0, 2), b: idList(m.b, ok).slice(0, 2), sa: scoreVal(m.sa), sb: scoreVal(m.sb) };
            if (tok.has(m.ta) && tok.has(m.tb) && m.ta !== m.tb) { x.ta = m.ta; x.tb = m.tb; }
            return x;
          })
          .filter(m => m.a.length && m.a.length === m.b.length)
      };
      const rt = idList(r.rt, tok);
      if (rt.length) rd.rt = rt;
      return rd;
    });
  if (raw.finals && typeof raw.finals === "object") {
    const H = normFinal(raw.finals.H, ok), F = normFinal(raw.finals.F, ok), T = normTeamFinal(raw.finals.T, ok, tok);
    const X = normFinal(raw.finals.X, ok), G = normFinal(raw.finals.G, ok);
    st.finals = H || F || T || X || G ? { H, F, T, X, G, date: String(raw.finals.date || "").slice(0, 10), afterRound: clampInt(raw.finals.afterRound, 0, 999, 0) } : null;
  }
  const usedTeams = teamsInPlay(st);
  st.teams = st.teams.filter(t => t.p.length || usedTeams.has(t.id));
  /* État d'avant le contrôle des scores : on garde « libre » si un score déjà saisi ne respecte pas les 21 points */
  if (!raw.settings || raw.settings.scoreFormat === undefined) {
    const R = { allowDraw: st.settings.allowDraw, scoreFormat: 21 };
    const all = [].concat.apply([], st.rounds.map(r => r.matches));
    if (st.finals) ["H", "F", "T", "X", "G"].forEach(k => { if (st.finals[k]) all.push(st.finals[k]); });
    st.settings.scoreFormat = all.some(m => m.sa != null && m.sb != null && scoreProblem(m.sa, m.sb, R)) ? 0 : 21;
  }
  st.history = (Array.isArray(raw.history) ? raw.history : [])
    .filter(h => h && typeof h === "object").slice(0, 30)
    .map(h => ({ date: String(h.date || "").slice(0, 10), players: clampInt(h.players, 0, 999, 0), rounds: clampInt(h.rounds, 0, 999, 0), H: strList(h.H), F: strList(h.F), T: strList(h.T), X: strList(h.X), G: strList(h.G) }));
  return st;
}

/* Équipes citées dans les manches ou la finale : elles restent même vides */
function teamsInPlay(st) {
  const used = new Set();
  st.rounds.forEach(r => {
    (r.rt || []).forEach(t => used.add(t));
    r.matches.forEach(m => { if (m.ta) { used.add(m.ta); used.add(m.tb); } });
  });
  if (st.finals && st.finals.T) { used.add(st.finals.T.ta); used.add(st.finals.T.tb); }
  return used;
}

function normName(s) {
  s = String(s == null ? "" : s).replace(/\s+/g, " ").trim().toLocaleLowerCase("fr-FR");
  s = s.replace(/(^|[\s\-'’])(\p{L})/gu, (m, p, c) => p + c.toLocaleUpperCase("fr-FR"));
  return s.slice(0, 30);
}

function sexOf(s) {
  const t = String(s || "").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (["H", "HOMME", "M", "MASCULIN", "GARCON", "G"].includes(t)) return "H";
  if (["F", "FEMME", "W", "DAME", "FEMININ", "FILLE"].includes(t)) return "F";
  return null;
}

function parseRoster(text, defSex) {
  const out = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    if (line.includes("\t")) {
      const cols = line.split("\t").map(c => c.trim()).filter(Boolean);
      if (cols.some(c => /^pr[ée]nom$/i.test(c))) return;
      let name = "", sex = null, active = true;
      cols.forEach(c => {
        const u = c.toUpperCase();
        if (u === "OUI" || u === "NON") { active = u === "OUI"; return; }
        if (sex === null && sexOf(c)) { sex = sexOf(c); return; }
        if (!name && !/^\d+$/.test(c)) name = c;
      });
      if (name) out.push({ name: normName(name), sex: sex || defSex, active });
      return;
    }
    line.split(/[;,]/).forEach(chunk => {
      let c = chunk.trim();
      if (!c) return;
      let sex = defSex;
      const m = c.match(/^(.+?)[\s:(\[\-–]+(h|f|homme|femme|fille|garçon|garcon|dame)[)\]]?$/i);
      if (m) { c = m[1]; sex = sexOf(m[2]) || defSex; }
      const name = normName(c);
      if (name && !/^pr[ée]nom$/i.test(name)) out.push({ name, sex, active: true });
    });
  });
  return out;
}

/* Combien de doubles, de simples et de repos pour n joueurs présents */
function planFormat(n, courts, fill) {
  let d = Math.floor(n / 4), s = 0;
  if (fill && n - 4 * d >= 2) s = 1;
  if (courts > 0) {
    if (d > courts) d = courts;
    if (d + s > courts) s = 0;
  }
  return { d, s, rest: n - 4 * d - 2 * s };
}

const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
function bump(map, k) { map.set(k, (map.get(k) || 0) + 1); }

function pairHistory(st) {
  const H = { partner: new Map(), opp: new Map(), played: new Map(), singles: new Map(), rests: new Map(), lastRest: new Map(), lastPartner: new Set(), lastOpp: new Set() };
  const last = st.rounds.length - 1;
  st.rounds.forEach((r, ri) => {
    r.rest.forEach(id => { bump(H.rests, id); H.lastRest.set(id, ri); });
    r.matches.forEach(m => {
      m.a.concat(m.b).forEach(id => bump(H.played, id));
      if (m.a.length === 1) { bump(H.singles, m.a[0]); bump(H.singles, m.b[0]); }
      [m.a, m.b].forEach(t => {
        if (t.length === 2) {
          const k = pairKey(t[0], t[1]);
          bump(H.partner, k);
          if (ri === last) H.lastPartner.add(k);
        }
      });
      m.a.forEach(x => m.b.forEach(y => {
        const k = pairKey(x, y);
        bump(H.opp, k);
        if (ri === last) H.lastOpp.add(k);
      }));
    });
  });
  return H;
}

function shuffle(a, rnd) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Répartit des groupes de 4 en équipes : évite de rejouer avec le même partenaire (poids fort) ou contre les mêmes adversaires */
function bestDoubles(ids, H, S, rnd) {
  const n = ids.length;
  if (n < 4) return [];
  const wP = S.partnerWeight, wO = S.opponentWeight;
  const pc = (a, b) => {
    const k = pairKey(a, b), c = H.partner.get(k) || 0;
    return c ? wP * c * c + (H.lastPartner.has(k) ? wP : 0) : 0;
  };
  const oc = (a, b) => {
    const k = pairKey(a, b), c = H.opp.get(k) || 0;
    return c ? wO * c + (H.lastOpp.has(k) ? wO : 0) : 0;
  };
  const split = q => {
    const [a, b, c, d] = q;
    let best = null, bc = Infinity;
    [[a, b, c, d], [a, c, b, d], [a, d, b, c]].forEach(([w, x, y, z]) => {
      const cost = pc(w, x) + pc(y, z) + oc(w, y) + oc(w, z) + oc(x, y) + oc(x, z);
      if (cost < bc) { bc = cost; best = [[w, x], [y, z]]; }
    });
    return { cost: bc, teams: best };
  };
  const groupsNeeded = n / 4;
  let best = null, bestCost = Infinity;
  for (let t = 0; t < S.tries && bestCost > 0; t++) {
    const arr = shuffle(ids.slice(), rnd);
    const groups = [];
    let cost = 0;
    for (let i = 0; i + 3 < n; i += 4) {
      const r = split(arr.slice(i, i + 4));
      cost += r.cost;
      groups.push(r);
      if (cost >= bestCost) break;
    }
    if (groups.length === groupsNeeded && cost < bestCost) { bestCost = cost; best = groups; }
  }
  let improved = true, guard = 0;
  while (improved && bestCost > 0 && guard++ < 200) {
    improved = false;
    for (let i = 0; i < best.length && !improved; i++) {
      for (let j = i + 1; j < best.length && !improved; j++) {
        const A = best[i].teams.flat(), B = best[j].teams.flat();
        for (let x = 0; x < 4 && !improved; x++) {
          for (let y = 0; y < 4 && !improved; y++) {
            const A2 = A.slice(), B2 = B.slice();
            const tmp = A2[x]; A2[x] = B2[y]; B2[y] = tmp;
            const ra = split(A2), rb = split(B2);
            const delta = ra.cost + rb.cost - best[i].cost - best[j].cost;
            if (delta < 0) { bestCost += delta; best[i] = ra; best[j] = rb; improved = true; }
          }
        }
      }
    }
  }
  return best.map(g => shuffle(g.teams.slice(), rnd));
}

function generateRound(st, rnd) {
  rnd = rnd || Math.random;
  if (st.settings.teamMode === "fixed") return generateTeamRound(st, rnd);
  const S = st.settings;
  const active = st.players.filter(p => p.active).map(p => p.id);
  const f = planFormat(active.length, S.courts, S.fillSingles);
  if (f.d + f.s === 0) {
    throw new Error(active.length < 2
      ? "Il faut au moins 2 joueurs présents."
      : "Pas assez de joueurs pour un double. Ajoutez des joueurs ou autorisez les simples dans les réglages.");
  }
  const H = pairHistory(st);
  const g = (m, k) => m.get(k) || 0;
  const lr = id => (H.lastRest.has(id) ? H.lastRest.get(id) : -1);
  /* Repos : ceux qui ont le plus joué sortent en premier, chacun son tour */
  const order = shuffle(active.slice(), rnd).sort((x, y) =>
    (g(H.played, y) - g(H.played, x)) || (g(H.rests, x) - g(H.rests, y)) || (lr(x) - lr(y)));
  const rest = order.slice(0, f.rest);
  const restSet = new Set(rest);
  let pool = shuffle(active.filter(id => !restSet.has(id)), rnd);
  /* Simple : ceux qui en ont le moins fait, sans rejouer le même adversaire */
  const singles = [];
  for (let k = 0; k < f.s; k++) {
    pool.sort((x, y) => g(H.singles, x) - g(H.singles, y));
    const first = pool[0];
    let bj = 1, bc = Infinity;
    for (let j = 1; j < pool.length; j++) {
      const c = g(H.singles, pool[j]) * 1000 + g(H.opp, pairKey(first, pool[j])) * (S.opponentWeight + 1) + rnd();
      if (c < bc) { bc = c; bj = j; }
    }
    singles.push([[first], [pool[bj]]]);
    pool = pool.filter((_, i) => i !== 0 && i !== bj);
  }
  const doubles = bestDoubles(pool, H, S, rnd);
  const matches = shuffle(doubles, rnd).concat(singles)
    .map((t, i) => ({ court: i + 1, a: t[0], b: t[1], sa: null, sb: null }));
  return { n: st.rounds.length + 1, rest, matches };
}

/* ===== Équipes fixes ===== */
const teamNum = id => parseInt(String(id).slice(1), 10) || 0;

/* Équipes qui peuvent jouer : deux joueurs, tous deux présents */
function activeTeams(st) {
  const act = new Set(st.players.filter(p => p.active).map(p => p.id));
  return st.teams.filter(t => t.p.length === 2 && t.p.every(id => act.has(id)));
}

/* Tirage des paires. Mixtes d'abord si demandé ; avec un nombre impair, un joueur reste sans équipe */
function drawPairs(players, mixed, rnd) {
  rnd = rnd || Math.random;
  const pairs = [];
  let pool;
  if (mixed) {
    const h = shuffle(players.filter(p => p.sex === "H").map(p => p.id), rnd);
    const f = shuffle(players.filter(p => p.sex === "F").map(p => p.id), rnd);
    while (h.length && f.length) pairs.push([h.pop(), f.pop()]);
    pool = shuffle(h.concat(f), rnd);
  } else {
    pool = shuffle(players.map(p => p.id), rnd);
  }
  for (let i = 0; i + 1 < pool.length; i += 2) pairs.push([pool[i], pool[i + 1]]);
  return { pairs: shuffle(pairs, rnd), left: pool.length % 2 ? [pool[pool.length - 1]] : [] };
}

/* Combien de matchs et d'équipes au repos pour T équipes */
function teamFormat(T, courts) {
  let m = Math.floor(T / 2);
  if (courts > 0 && m > courts) m = courts;
  return { m, rest: T - 2 * m };
}

function teamHistory(st) {
  const H = { played: new Map(), rests: new Map(), lastRest: new Map(), meet: new Map(), lastMeet: new Set() };
  const last = st.rounds.length - 1;
  st.rounds.forEach((r, ri) => {
    (r.rt || []).forEach(t => { bump(H.rests, t); H.lastRest.set(t, ri); });
    r.matches.forEach(m => {
      if (!m.ta || !m.tb) return;
      bump(H.played, m.ta); bump(H.played, m.tb);
      const k = pairKey(m.ta, m.tb);
      bump(H.meet, k);
      if (ri === last) H.lastMeet.add(k);
    });
  });
  return H;
}

/* Appariement de coût minimal (recherche exhaustive élaguée, plafonnée à cap nœuds) */
function minCostMatching(ids, cost, rnd, cap) {
  const n = ids.length;
  if (n < 2) return { cost: 0, pairs: [] };
  const order = shuffle(ids.slice(), rnd);
  const C = order.map(x => order.map(y => (x === y ? 0 : cost(x, y))));
  let minC = Infinity;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (C[i][j] < minC) minC = C[i][j];
  const half = Math.floor(n / 2);
  const used = new Array(n).fill(false), cur = [];
  let best = null, bestCost = Infinity, nodes = 0;
  const dfs = acc => {
    if (acc + minC * (half - cur.length) >= bestCost || nodes++ > cap) return;
    let i = 0;
    while (i < n && used[i]) i++;
    if (i === n) { bestCost = acc; best = cur.slice(); return; }
    used[i] = true;
    const cand = [];
    for (let j = i + 1; j < n; j++) if (!used[j]) cand.push(j);
    cand.sort((x, y) => C[i][x] - C[i][y]);
    for (let k = 0; k < cand.length && bestCost > 0; k++) {
      const j = cand[k];
      used[j] = true;
      cur.push([order[i], order[j]]);
      dfs(acc + C[i][j]);
      cur.pop();
      used[j] = false;
    }
    used[i] = false;
  };
  dfs(0);
  return { cost: bestCost, pairs: best || [] };
}

/* Manche à équipes fixes : repos à tour de rôle, puis des adversaires pas encore rencontrés.
   Quand toutes les équipes jouent, les manches d'un tournoi toutes rondes (méthode du cercle) sont proposées en premier :
   avec les mêmes équipes, chacune rencontre toutes les autres une fois avant de revoir la même. */
function generateTeamRound(st, rnd) {
  rnd = rnd || Math.random;
  const S = st.settings;
  const teams = activeTeams(st).map(t => t.id);
  const T = teams.length;
  if (T < 2) throw new Error("Il faut au moins 2 équipes complètes, avec leurs deux joueurs présents.");
  const f = teamFormat(T, S.courts);
  const H = teamHistory(st);
  const g = (m, k) => m.get(k) || 0;
  const lr = t => (H.lastRest.has(t) ? H.lastRest.get(t) : -1);
  const maxPlayed = Math.max.apply(null, teams.map(t => g(H.played, t)));
  const minRests = Math.min.apply(null, teams.map(t => g(H.rests, t)));
  /* Se reposer coûte cher à une équipe qui a moins joué ou déjà plus reposé que les autres */
  const restCost = t => 1e9 * (maxPlayed - g(H.played, t)) + 1e6 * (g(H.rests, t) - minRests) + 1e3 * (lr(t) + 1);
  const meetCost = (x, y) => {
    const k = pairKey(x, y), c = g(H.meet, k);
    return c ? 100 * c * c + (H.lastMeet.has(k) ? 100 : 0) : 0;
  };
  const cands = [];
  if (f.rest === T % 2) {
    const arr = teams.slice();
    if (arr.length % 2) arr.push(null);
    const m = arr.length;
    for (let r = 0; r < m - 1; r++) {
      const rot = [arr[0]];
      for (let i = 0; i < m - 1; i++) rot.push(arr[1 + ((i + r) % (m - 1))]);
      const pairs = [], rest = [];
      for (let i = 0; i < m / 2; i++) {
        const x = rot[i], y = rot[m - 1 - i];
        if (x === null) rest.push(y); else if (y === null) rest.push(x); else pairs.push([x, y]);
      }
      cands.push({ rest, pairs });
    }
    shuffle(cands, rnd);
  }
  const order = shuffle(teams.slice(), rnd).sort((x, y) => restCost(x) - restCost(y));
  const rest = order.slice(0, f.rest), restSet = new Set(rest);
  cands.push({ rest, pairs: minCostMatching(teams.filter(t => !restSet.has(t)), meetCost, rnd, 60000).pairs });
  let best = null, bc = Infinity;
  cands.forEach(c => {
    const cost = c.rest.reduce((s, t) => s + restCost(t), 0) + c.pairs.reduce((s, p) => s + meetCost(p[0], p[1]), 0);
    if (cost < bc) { bc = cost; best = c; }
  });
  const byId = new Map(st.teams.map(t => [t.id, t]));
  const matches = shuffle(best.pairs.slice(), rnd).map((p, i) => {
    const q = rnd() < 0.5 ? p : [p[1], p[0]];
    return { court: i + 1, a: byId.get(q[0]).p.slice(), b: byId.get(q[1]).p.slice(), sa: null, sb: null, ta: q[0], tb: q[1] };
  });
  const rt = best.rest.slice();
  const round = { n: st.rounds.length + 1, rest: [].concat.apply([], rt.map(t => byId.get(t).p)), matches };
  if (rt.length) round.rt = rt;
  return round;
}

function computeTeamStandings(st) {
  const S = st.settings;
  const act = new Set(st.players.filter(p => p.active).map(p => p.id));
  const nameOf = id => { const p = st.players.find(x => x.id === id); return p ? p.name : "?"; };
  const rows = new Map();
  st.teams.forEach(t => rows.set(t.id, {
    id: t.id, p: t.p.slice(), name: t.p.length ? t.p.map(nameOf).join(" & ") : "?",
    active: t.p.length === 2 && t.p.every(id => act.has(id)),
    J: 0, V: 0, D: 0, N: 0, Pts: 0, PM: 0, PE: 0, Rep: 0, diff: 0, rank: 0, opp: []
  }));
  const add = (tid, f, a, oid) => {
    const x = rows.get(tid);
    if (!x) return;
    x.J++; x.PM += f; x.PE += a;
    if (!x.opp.includes(oid)) x.opp.push(oid);
    if (f > a) { x.V++; x.Pts += S.winPts; }
    else if (f < a) { x.D++; x.Pts += S.lossPts; }
    else { x.N++; x.Pts += S.drawPts; }
  };
  st.rounds.forEach(r => {
    (r.rt || []).forEach(t => { const x = rows.get(t); if (x) x.Rep++; });
    r.matches.forEach(m => {
      if (m.ta && m.tb && scoreState(m, S) === "done") { add(m.ta, m.sa, m.sb, m.tb); add(m.tb, m.sb, m.sa, m.ta); }
    });
  });
  const list = Array.from(rows.values()).filter(x => x.active || x.J > 0);
  list.forEach(x => { x.diff = x.PM - x.PE; });
  list.sort(rankCmp);
  list.forEach((x, i) => { x.rank = i + 1; });
  return list;
}

/* Finale à équipes fixes : 1re équipe contre 2e */
function makeTeamFinal(st, seeds) {

  return { ta: seeds[0].id, tb: seeds[1].id, a: tp(seeds[0].id), b: tp(seeds[1].id), seedA: [1], seedB: [2], sa: null, sb: null };

/* Pourquoi un score complet est impossible ("" s'il est bon). rules = { allowDraw, scoreFormat } */
function scoreProblem(a, b, rules) {
  const T = rules.scoreFormat || 0;
  if (a === b) return rules.allowDraw ? "" : "Égalité impossible : il faut un vainqueur.";
  if (!T) return "";
  const w = Math.max(a, b), l = Math.min(a, b), C = SCORE_CAP[T] || T + 9;
  const sc = w + "–" + l;
  if (w > C) return `${sc} : un set s’arrête à ${C} points.`;
  if (w < T) return `${sc} : le vainqueur doit atteindre ${T} points.`;
  if (w === T) return l <= T - 2 ? "" : `${sc} : il faut 2 points d’écart, le set continue (${T + 1}–${T - 1}, ${T + 2}–${T}…).`;
  if (w === C) return l >= C - 2 ? "" : `${sc} impossible : à ${C} points, l’autre a forcément ${C - 2} ou ${C - 1}.`;
  if (l === w - 2) return "";
  return l === w - 1 ? `${sc} : il faut 2 points d’écart, le set continue.` : `${sc} impossible : au-delà de ${T}, le set se termine avec 2 points d’écart (${w}–${w - 2}).`;
}

/* rules : réglages du tournoi ({ allowDraw, scoreFormat }) ou, comme avant, un simple booléen allowDraw */
function scoreState(m, rules) {
  const R = rules && typeof rules === "object" ? rules : { allowDraw: !!rules, scoreFormat: 0 };
  const a = m.sa, b = m.sb;
  if (a == null && b == null) return "empty";
  if (a == null || b == null) return "partial";
  if (a === b && !R.allowDraw) return "tie";
  return scoreProblem(a, b, R) ? "bad" : "done";
}

function rankCmp(x, y) {
  return (y.Pts - x.Pts) || (y.diff - x.diff) || (y.PM - x.PM) || x.name.localeCompare(y.name, "fr", { sensitivity: "base" });
}

function computeStandings(st) {
  const S = st.settings;
  const rows = new Map();
  st.players.forEach(p => rows.set(p.id, { id: p.id, name: p.name, sex: p.sex, active: p.active, J: 0, V: 0, D: 0, N: 0, Pts: 0, PM: 0, PE: 0, Rep: 0, diff: 0, rank: 0, srank: 0 }));
  const add = (team, f, a) => team.forEach(id => {
    const x = rows.get(id);
    if (!x) return;
    x.J++; x.PM += f; x.PE += a;
    if (f > a) { x.V++; x.Pts += S.winPts; }
    else if (f < a) { x.D++; x.Pts += S.lossPts; }
    else { x.N++; x.Pts += S.drawPts; }
  });
  st.rounds.forEach(r => {
    r.rest.forEach(id => { const x = rows.get(id); if (x) x.Rep++; });
    r.matches.forEach(m => {
      if (scoreState(m, S) === "done") { add(m.a, m.sa, m.sb); add(m.b, m.sb, m.sa); }
    });
  });
  const list = Array.from(rows.values()).filter(x => x.active || x.J > 0);
  list.forEach(x => { x.diff = x.PM - x.PE; });
  list.sort(rankCmp);
  const cnt = { H: 0, F: 0 };
  list.forEach((x, i) => { x.rank = i + 1; x.srank = ++cnt[x.sex]; });
  return list;
}

function finalSeeds(rows, sex) {
  return rows.filter(x => x.sex === sex && x.active && x.J > 0).slice(0, 4);
}

/* Finale directe : 1er + 4e contre 2e + 3e ; en simple 1er contre 2e s'il n'y a que 2 ou 3 qualifiés */
function makeFinal(seeds) {
  if (seeds.length >= 4) return { a: [seeds[0].id, seeds[3].id], b: [seeds[1].id, seeds[2].id], seedA: [1, 4], seedB: [2, 3], sa: null, sb: null };
  if (seeds.length >= 2) return { a: [seeds[0].id], b: [seeds[1].id], seedA: [1], seedB: [2], sa: null, sb: null };
  return null;
}

/* Double mixte équilibré : 1er homme + 2e femme contre 2e homme + 1re femme */
function makeMixedFinal(h, f) {
  if (h.length < 2 || f.length < 2) return null;
  return { a: [h[0].id, f[1].id], b: [h[1].id, f[0].id], seedA: [1, 2], seedB: [2, 1], sa: null, sb: null };
}

/* Les 4 premiers du classement mixte (hommes et femmes confondus) */
function generalSeeds(rows) {
  return rows.filter(x => x.active && x.J > 0).slice(0, 4);
}

/* Finales selon la formule et, en mêlée, le format choisi :
   sexes = finale hommes + finale femmes ; mixte = un double mixte (X) ; general = 1er + 4e contre 2e + 3e du classement mixte (G) */
function buildFinals(st) {

  if (st.settings.teamMode === "fixed") { out.T = makeTeamFinal(st, teamFinalSeeds(computeTeamStandings(st))); return out; }

  else if (fmt === "general") out.G = makeFinal(generalSeeds(rows));
  else { out.H = makeFinal(finalSeeds(rows, "H")); out.F = makeFinal(finalSeeds(rows, "F")); }
  return out;
}

function finalWinner(f, rules) {
  if (!f || f.sa == null || f.sb == null || f.sa === f.sb) return null;
  if (rules && scoreProblem(f.sa, f.sb, { allowDraw: false, scoreFormat: rules.scoreFormat })) return null;

}

function onRemoteError(e) {

function isTyping() {

}
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !(main.contains(a) || sheetPanel.contains(a))) return null;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (x) { /* champ sans sélection */ }
  return { id: a.id, s, e };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  try {
    el.focus({ preventScroll: true });
    if (f.s != null && el.setSelectionRange) el.setSelectionRange(f.s, f.e);
  } catch (x) { /* rien */ }
}
function render(opts) {

}

function toast(msg, action) {

}

/* ---------- Actions ---------- */
function addPlayer(name, sex) {
  const nm = normName(name);
  if (!nm) return "Saisissez un prénom.";
  if (state.players.some(p => p.name.toLocaleLowerCase("fr") === nm.toLocaleLowerCase("fr"))) return `${nm} est déjà inscrit. Ajoutez une initiale, par exemple « ${nm} B. ».`;
  state.players.push({ id: "p" + state.nextId++, name: nm, sex: sex === "F" ? "F" : "H", active: true });
  touch();
  return "";
}
function redrawOffer(msg) {
  const lr = lastRound();
  if (lr && !state.finals && !roundStats(lr).any) toast(msg + ` Refaire le tirage de la manche ${lr.n} ?`, { label: "Refaire", run: redraw });
}

  const added = state.players[state.players.length - 1].name;
  render();
  const again = $("#addName");
  if (again) again.focus({ preventScroll: true });

function addPasted() {
  const ta = $("#pasteArea");
  const list = parseRoster(ta.value, ui.sex);
  const names = new Set(state.players.map(p => p.name.toLocaleLowerCase("fr")));
  let added = 0, dup = 0;
  list.forEach(x => {
    const k = x.name.toLocaleLowerCase("fr");
    if (names.has(k)) { dup++; return; }
    names.add(k);
    state.players.push({ id: "p" + state.nextId++, name: x.name, sex: x.sex, active: x.active !== false });

  });
  if (!added) { toast(dup ? "Tous ces prénoms sont déjà inscrits." : "Aucun prénom trouvé dans la liste."); return; }
  touch();
  ui.pasteOpen = false;

  toast(pl(added, "joueur ajouté", "joueurs ajoutés") + (dup ? " · " + pl(dup, "doublon ignoré", "doublons ignorés") : ""));
}
function setActive(id, on) {
  const p = playerById(id);
  if (!p) return;
  p.active = on;
  touch();
  render();
  if (fixed() && !teamOfPlayer(id)) return;
  const lr = lastRound();
  const inRound = lr && (lr.rest.includes(id) || lr.matches.some(m => m.a.includes(id) || m.b.includes(id)));
  if (!on && inRound) redrawOffer(p.name + " est absent.");
  else if (on && !inRound) redrawOffer(p.name + " est présent.");
}
function renamePlayer(id, value, input) {
  const p = playerById(id);
  if (!p) return;
  const nm = normName(value);
  if (!nm) { input.value = p.name; return; }
  if (state.players.some(q => q.id !== id && q.name.toLocaleLowerCase("fr") === nm.toLocaleLowerCase("fr"))) {
    input.value = p.name;
    toast(nm + " existe déjà.");
    return;
  }
  input.value = nm;
  if (nm !== p.name) { p.name = nm; touch(); }
}
function toggleSex(id) {
  const p = playerById(id);
  if (!p) return;
  p.sex = p.sex === "H" ? "F" : "H";
  touch();
  render();
}
function deletePlayer(id) {
  const p = playerById(id);
  if (!p) return;
  if (involvedIds().has(id)) { toast(p.name + " a déjà joué : décochez « présent » à la place."); return; }
  const snap = clone(state);
  state.players = state.players.filter(x => x.id !== id);
  state.teams.forEach(t => { t.p = t.p.filter(x => x !== id); });
  pruneTeams();
  if (ui.pick === id) ui.pick = null;

  undoable(p.name + " supprimé.", snap);

/* ----- Équipes fixes ----- */
function newTeam(ids) {
  const n = state.teams.reduce((mx, t) => Math.max(mx, teamNum(t.id)), 0) + 1;
  const t = { id: "t" + n, p: ids.slice(0, 2) };
  state.teams.push(t);
  return t;
}
/* Retire les équipes vides ; avant le tournoi, renumérote de 1 à n */
function pruneTeams() {
  const used = teamsInPlay(state);
  state.teams = state.teams.filter(t => t.p.length || used.has(t.id));
  if (!started()) state.teams.forEach((t, i) => { t.id = "t" + (i + 1); });
}
/* Après un remplacement, les matchs pas encore commencés de la manche en cours prennent la nouvelle composition */
function syncRoundTeams() {
  const lr = lastRound();
  if (!lr || state.finals) return;
  lr.matches.forEach(m => {
    if (!m.ta || m.sa != null || m.sb != null) return;
    const A = teamById(m.ta), B = teamById(m.tb);
    if (A && A.p.length === 2) m.a = A.p.slice();
    if (B && B.p.length === 2) m.b = B.p.slice();
  });
  if (lr.rt) lr.rest = [].concat.apply([], lr.rt.map(t => { const x = teamById(t); return x ? x.p.slice() : []; }));
}
function drawTeams() {
  if (readOnly || started()) return;
  const act = state.players.filter(p => p.active);
  if (act.length < 2) { toast("Ajoutez au moins 2 joueurs présents."); return; }
  const snap = clone(state), had = state.teams.length > 0;
  const d = drawPairs(act, state.settings.mixedTeams);
  state.teams = d.pairs.map((p, i) => ({ id: "t" + (i + 1), p }));
  ui.pick = null;
  touch();
  render();
  const msg = pl(d.pairs.length, "équipe tirée", "équipes tirées") + " au sort" + (d.left.length ? " · " + pname(d.left[0]) + " reste sans équipe" : "") + ".";
  if (had) undoable(msg, snap); else toast(msg);
}
function clearTeams() {
  if (readOnly || started() || !state.teams.length) return;
  const snap = clone(state);
  state.teams = [];
  ui.pick = null;
  touch();
  render();
  undoable("Équipes défaites : touchez deux joueurs pour former une équipe.", snap);
}
function pairFree() {
  if (readOnly) return;
  const free = freePlayers();
  if (free.length < 2) return;
  const snap = clone(state);
  const d = drawPairs(free, state.settings.mixedTeams);
  d.pairs.forEach(p => newTeam(p));
  ui.pick = null;
  touch();
  render();
  const msg = pl(d.pairs.length, "équipe formée", "équipes formées") + (d.left.length ? " · " + pname(d.left[0]) + " reste sans équipe" : "") + ".";
  const lr = lastRound();
  if (lr && !state.finals && !roundStats(lr).any) redrawOffer(msg);
  else undoable(msg, snap);
}
function goTeams() {
  if (!fixed()) return;
  if (!readOnly && !started() && !state.teams.length) drawTeams();
  switchTab("equipes");
}
function pickPlayer(id) {
  if (readOnly || !playerById(id)) return;
  if (!ui.pick || !playerById(ui.pick)) {
    ui.pick = id;
    render();
    const t = teamOfPlayer(id), nm = pname(id);
    toast(t ? (started() ? nm + " : touchez un joueur sans équipe pour le remplacer." : nm + " : touchez le joueur avec qui l’échanger.")
      : nm + " : touchez un autre joueur sans équipe pour former une équipe, ou un joueur à remplacer.");
    return;
  }
  if (ui.pick === id) { ui.pick = null; hideToast(); render(); return; }
  const x = ui.pick;
  ui.pick = null;
  swapPlayers(x, id);
}
function swapPlayers(x, y) {
  const tx = teamOfPlayer(x), ty = teamOfPlayer(y);
  const snap = clone(state);
  let msg;
  if (!tx && !ty) {
    const t = newTeam([x, y]);
    msg = `${teamLabel(t.id)} formée : ${team(t.p)}.`;
  } else if (tx && ty) {
    if (tx === ty) { hideToast(); render(); return; }
    if (started()) { render(); toast("Le tournoi a commencé : les équipes ne s’échangent plus leurs joueurs. Remplacez un joueur par un joueur sans équipe."); return; }
    tx.p[tx.p.indexOf(x)] = y;
    ty.p[ty.p.indexOf(y)] = x;
    msg = `${pname(x)} et ${pname(y)} échangés.`;
  } else {
    const t = tx || ty, out = tx ? x : y, inn = tx ? y : x;
    t.p[t.p.indexOf(out)] = inn;
    msg = `${pname(inn)} remplace ${pname(out)} dans l’équipe ${teamNum(t.id)}.`;
  }
  syncRoundTeams();
  touch();
  render();
  undoable(msg, snap);
}
function fillSlot(tid) {
  const t = teamById(tid);
  if (readOnly || !t || t.p.length >= 2) return;
  const x = ui.pick;
  if (!x || !playerById(x)) { toast("Touchez d’abord un joueur, puis cette place."); return; }
  const from = teamOfPlayer(x);
  ui.pick = null;
  if (from === t) { hideToast(); render(); return; }
  if (from && started()) { render(); toast("Le tournoi a commencé : choisissez un joueur sans équipe."); return; }
  const snap = clone(state);
  if (from) from.p = from.p.filter(id => id !== x);
  t.p.push(x);
  pruneTeams();
  syncRoundTeams();
  touch();
  render();
  const now = teamOfPlayer(x);
  undoable(`${pname(x)} rejoint l’équipe ${now ? teamNum(now.id) : ""}.`, snap);
}
function setMode(m) {
  if (readOnly) return;

/* Montre la manche à compléter ou corriger, encadre les terrains concernés et dit pourquoi */
function flagIncomplete(ri, st) {

  const first = document.getElementById("card-r" + ri + "m" + st.missing[0]);
  if (first) first.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  const why = mi => "terrain " + r.matches[mi].court + (st.bad.includes(mi) ? " (score à vérifier)" : " (score manquant)");

/* Avant de passer à la suite : tous les scores de toutes les manches doivent être complets et possibles */

/* Récapitulatif de la manche à valider avant de lancer la suivante ou les finales */

function launchRound(opts) {

  ui.pick = null;

  ui.unlock = null;
  ui.rankK = null;

}
function redraw() {

  state.rounds.pop();
  let r;
  try { r = generateRound(state); } catch (e) { state = normalizeState(snap); toast(e.message); return; }
  state.rounds.push(r);

}
function cancelRound() {
  const lr = lastRound();
  if (readOnly || !lr || roundStats(lr).any || state.finals) return;
  const snap = clone(state);
  state.rounds.pop();

  touch({ now: true });
  render();
  undoable(`Manche ${lr.n} annulée.`, snap);
}
function createFinals(opts) {
  if (readOnly) return;
  if (state.finals) { switchTab("finales"); return; }
  const lr = lastRound();
  if (!lr) { toast(fixed() ? "Jouez au moins une manche avant la finale." : "Jouez au moins une manche avant les finales."); return; }
  if (!checkAllRounds()) return;
  const f = buildFinals(state), fmt = finalsFormat();
  if (!FINAL_KEYS.some(k => f[k])) {
    toast(fmt === "team" ? "Il faut au moins 2 équipes classées pour la finale."
      : fmt === "mixte" ? "Double mixte impossible : il faut au moins 2 hommes et 2 femmes classés. Choisissez un autre format."
      : fmt === "general" ? "Il faut au moins 2 joueurs classés pour une finale."
      : "Il faut au moins 2 joueurs ou 2 joueuses classés pour une finale.");

  if (!(opts && opts.confirmed)) { confirmRound(lr, fmt === "sexes" ? "Créer les finales" : "Créer la finale", () => createFinals({ confirmed: true })); return; }
  state.finals = { H: f.H, F: f.F, T: f.T, X: f.X, G: f.G, date: localISODate(), afterRound: state.rounds.length };
  ui.unlock = null;
  ui.all = false;

  render();
  window.scrollTo(0, 0);
}
function cancelFinals() {
  if (readOnly || !state.finals) return;

  render();
  undoable("Finales annulées.", snap);
}
function archive() {
  const F = state.finals;

  const win = sx => { const f = F[sx], w = finalWinner(f, finalRules()); return w ? f[w].map(pname) : []; };
  const rec = { date: F.date || localISODate(), players: involvedIds().size, rounds: state.rounds.length, H: win("H"), F: win("F"), T: win("T"), X: win("X"), G: win("G") };
  if (rec.H.length || rec.F.length || rec.T.length || rec.X.length || rec.G.length) state.history = [rec].concat(state.history).slice(0, 30);
}
function newTournament() {
  const fr = finalRules();
  const done = state.finals && FINAL_KEYS.some(k => finalWinner(state.finals[k], fr));
  confirmAction({
    title: "Nouveau tournoi",
    text: "Les manches, les scores et les finales seront effacés. Les joueurs" + (fixed() ? ", les équipes" : "") + " et les réglages sont conservés." + (done ? " Les vainqueurs rejoignent le palmarès." : ""),
    ok: "Effacer les résultats",
    danger: true,
    run: () => {
      const snap = clone(state);

      state.rounds = [];

function clearAll() {
  confirmAction({
    title: "Tout effacer",
    text: "Les joueurs, les manches et les finales seront supprimés. Le palmarès et les réglages restent.",
    ok: "Tout effacer",
    danger: true,
    run: () => {

      state.players = [];
      state.teams = [];
      state.rounds = [];

function resetExample() {

function setScore(ref, side, val) {
  const m = matchByRef(ref);
  if (!m) return;
  if (side === "a") m.sa = val; else m.sb = val;
  touch();
  patchCard(ref);
  if (ref[0] === "r") patchRoundFooter(+/^r(\d+)/.exec(ref)[1]);
  else { const slot = document.getElementById("champ-" + ref.slice(1)); if (slot) slot.innerHTML = championInner(ref.slice(1)); }
  renderChrome();
}
function setSetting(k, v) {
  if (readOnly) return;
  const S = Object.assign({}, state.settings);
  if (k === "allowDraw" || k === "fillSingles" || k === "mixedTeams") S[k] = !!v;
  else if (k === "finalFormat") {
    if (state.finals) { toast("Les finales sont créées : annulez-les pour changer de format."); return; }
    S[k] = v;
  } else {
    const n = typeof v === "number" ? v : parseInt(String(v).replace(/[^\d]/g, ""), 10);
    if (!Number.isFinite(n)) { renderSettings(); return; }
    S[k] = n;
  }
  const before = state.settings.scoreFormat;
  state.settings = normSettings(S);
  touch();
  render();
  if (k === "scoreFormat" && state.settings.scoreFormat !== before) {
    let n = 0;
    state.rounds.forEach(r => { n += roundStats(r).bad.length; });
    toast(n ? pl(n, "score déjà saisi ne respecte", "scores déjà saisis ne respectent") + " pas ce format : " + (n > 1 ? "ils sont signalés" : "il est signalé") + " « À vérifier »."

function switchTab(tab) {
  if (!TABS.includes(tab)) return;

  ui.unlock = null;
  ui.pick = null;
  ui.tab = tab;
  saveLocal();
  render();
  window.scrollTo(0, 0);
}

/* ---------- Textes à partager ---------- */
function roundText(ri) {
  const r = state.rounds[ri];
  const lines = ["Manche " + r.n];
  const side = (ids, tid) => (tid ? `${teamLabel(tid)} (${team(ids)})` : team(ids));
  r.matches.forEach(m => {
    const sc = m.sa != null && m.sb != null ? ` ${m.sa}–${m.sb} ` : " contre ";
    const check = m.sa != null && m.sb != null && scoreState(m, state.settings) !== "done" ? " (score à vérifier)" : "";
    lines.push(`Terrain ${m.court} : ${side(m.a, m.ta)}${sc}${side(m.b, m.tb)}${m.a.length === 1 ? " (simple)" : ""}${check}`);
  });
  if (r.rt && r.rt.length) lines.push("Au repos : " + r.rt.map(t => `${teamLabel(t)} (${teamNames(t)})`).join(", "));
  else if (r.rest.length) lines.push("Au repos : " + r.rest.map(pname).join(", "));
  return lines.join("\n");
}
function rankText() {
  const ctx = rankContext(), after = " · après la manche " + ctx.k;
  if (ctx.teams) {
    return ["Classement des équipes" + after]
      .concat(ctx.rows.map(x => `${x.rank}. ${x.name} (éq. ${teamNum(x.id)}) · ${pl(x.Pts, "pt", "pts")} · GA ${signed(x.diff)}${moveText(moveOf(ctx, x, false))}`)).join("\n");
  }
  const v = ui.rank;
  const list = v === "all" ? ctx.rows : ctx.rows.filter(x => x.sex === v);
  const title = v === "all" ? "Classement mixte" : v === "H" ? "Classement hommes" : "Classement femmes";
  return [title + after]
    .concat(list.map(x => `${v === "all" ? x.rank : x.srank}. ${x.name} · ${pl(x.Pts, "pt", "pts")} · GA ${signed(x.diff)}${moveText(moveOf(ctx, x, v !== "all"))}`)).join("\n");
}
function allScoresText() {
  const parts = [];
  if (state.finals) parts.push(resultsText());
  for (let i = state.rounds.length - 1; i >= 0; i--) parts.push(roundText(i));
  return parts.join("\n\n");
}
function resultsText() {
  const F = state.finals, lines = ["Résultats · " + fmtDate(F.date || localISODate())];
  FINAL_KEYS.forEach(sx => {
    const f = F[sx];
    if (!f) return;
    const title = FINAL_TITLE[sx], w = finalWinner(f, finalRules());
    const nm = k => (sx === "T" ? `${team(f[k])} (${teamLabel(k === "a" ? f.ta : f.tb)})` : team(f[k]));
    if (!w) { lines.push(`${title} : ${nm("a")} contre ${nm("b")} (à jouer)`); return; }
    const l = w === "a" ? "b" : "a", sw = w === "a" ? f.sa : f.sb, sl = w === "a" ? f.sb : f.sa;
    lines.push(`${title} : ${nm(w)} ${f[w].length > 1 ? "battent" : "bat"} ${nm(l)} ${sw}–${sl}`);
  });
  return lines.join("\n");
}

/* ---------- Écouteurs ---------- */
document.addEventListener("click", e => {
  if (e.target === sheet) { closeSheet(); return; }
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case "tab": switchTab(t.dataset.tab); break;
    case "settings": openSheet("settings"); break;
    case "close-sheet": closeSheet(); break;
    case "sync-info": toast(SYNC_TEXT[syncState]); break;
    case "addsex":
      ui.sex = t.dataset.sex === "F" ? "F" : "H";
      document.querySelectorAll('[data-act="addsex"]').forEach(b => b.setAttribute("aria-checked", String(b.dataset.sex === ui.sex)));

      break;
    case "sex": if (!readOnly) toggleSex(id); break;
    case "del": if (!readOnly) deletePlayer(id); break;
    case "paste": if (!readOnly) addPasted(); break;
    case "launch": launchRound(); break;
    case "round": ui.round = +t.dataset.i; ui.all = false; ui.unlock = null; render(); window.scrollTo(0, 0); break;
    case "round-all": ui.all = true; ui.unlock = null; render(); break;
    case "copy-all": copyText(allScoresText()); break;
    case "unlock": unlockRound(+t.dataset.i); break;
    case "relock": relockRound(); break;
    case "fmt": setSetting("scoreFormat", Number(t.dataset.v)); break;
    case "final-fmt": setSetting("finalFormat", t.dataset.v); break;
    case "rank-round": ui.rankK = +t.dataset.k; ui.open = null; render(); break;
    case "redraw": redraw(); break;
    case "cancel-round": cancelRound(); break;
    case "finals-create": createFinals(); break;
    case "finals-cancel": cancelFinals(); break;
    case "new-tournament": if (!readOnly) newTournament(); break;
    case "clear-all": if (!readOnly) clearAll(); break;
    case "example-reset": if (!readOnly) resetExample(); break;
    case "confirm-ok": { const run = pendingConfirm; closeSheet(); if (run) run(); break; }
    case "copy-round": copyText(roundText(+t.dataset.i)); break;
    case "copy-rank": copyText(rankText()); break;
    case "copy-results": copyText(resultsText()); break;
    case "rank": ui.rank = t.dataset.v; ui.open = null; saveLocal(); render(); break;
    case "rowtoggle": toggleRow(t); break;
    case "toast-action": { const a = toastAction; hideToast(); if (a) a.run(); break; }
    case "step": setSetting("courts", state.settings.courts + Number(t.dataset.d)); break;
    case "mode": setMode(t.dataset.mode); break;
    case "go-teams": goTeams(); break;
    case "team-draw": drawTeams(); break;
    case "team-clear": clearTeams(); break;
    case "team-pair-free": pairFree(); break;

    case "slot": fillSlot(t.dataset.team); break;

  }
});
function toggleRow(tr) {

  tr.setAttribute("aria-expanded", String(open));
  if (open) {
    const ctx = rankContext(), id = tr.dataset.id, x = ctx.rows.find(y => y.id === id);
    if (x) tr.nextElementSibling.innerHTML = detailCell(x, (ctx.teams ? teamMatchLines(id) : playerMatchLines(id)).filter(l => l.n <= ctx.k));

function unlockRound(ri) {

  ui.unlock = ri;
  render();

  toast(`Manche ${state.rounds[ri].n} déverrouillée : modifiez le score, puis touchez « Terminer la correction ».`);

}
function relockRound() {
  const ri = ui.unlock;
  ui.unlock = null;
  render();
  const r = state.rounds[ri];
  if (!r) return;
  const st = roundStats(r);
  if (st.done < st.total) toast(`Attention : manche ${r.n}, ${pl(st.total - st.done, "score manque ou est à vérifier", "scores manquent ou sont à vérifier")}.`);

document.addEventListener("submit", e => {
  if (e.target.id === "addForm") { e.preventDefault(); if (!readOnly) addFromForm(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches('input[data-act="active"]')) { if (!readOnly) setActive(t.dataset.id, t.checked); }
  else if (t.matches(".pname-input")) { if (!readOnly) renamePlayer(t.dataset.id, t.value, t); }
  else if (t.matches("[data-set]")) {
    setSetting(t.dataset.set, t.type === "checkbox" ? t.checked : t.value);
    if (t.dataset.set === "mixedTeams" && !readOnly && !started() && state.teams.length) {
      toast(t.checked ? "Paires mixtes activées." : "Paires mixtes désactivées.", { label: "Refaire le tirage", run: drawTeams });
    }
  }
});
main.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "addName") { const msg = $("#addMsg"); if (msg) msg.hidden = true; return; }
  if (!t.matches("input.score") || readOnly || t.readOnly) return;
  const clean = t.value.replace(/\D/g, "").slice(0, 2);
  if (clean !== t.value) t.value = clean;
  setScore(t.dataset.ref, t.dataset.side, clean === "" ? null : parseInt(clean, 10));
});
main.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.matches("input.score")) {
    e.preventDefault();
    let next = null;
    if (t.dataset.side === "a") next = document.getElementById("sc-" + t.dataset.ref + "-b");
    else {
      const all = Array.from(main.querySelectorAll('input.score[data-side="a"]'));
      const card = t.closest(".match");
      const idx = all.findIndex(x => x.closest(".match") === card);
      next = all[idx + 1] || null;
    }
    if (next) next.focus(); else t.blur();
  } else if (e.key === "Enter" && t.matches(".pname-input")) {
    e.preventDefault();
    t.blur();
  } else if ((e.key === "Enter" || e.key === " ") && t.matches("tr.r-row")) {
    e.preventDefault();
    toggleRow(t);
  }
});
main.addEventListener("focusout", () => {
  if (!deferredRender) return;
  setTimeout(() => { if (deferredRender && !isTyping()) render(); }, 0);
});
document.addEventListener("toggle", e => { if (e.target && e.target.id === "pasteBox") ui.pasteOpen = e.target.open; }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) closeSheet(); });

/* Garder l'écran allumé pendant le tournoi (si le navigateur le permet) */
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  if (!state.rounds.length) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerup", keepAwake, { passive: true });

/* ---------- Démarrage ---------- */
function boot(hotData) {
  const local = readLocal();
  if (local && local.state) {
    state = normalizeState(local.state);
    pending = local.pending === true;
    if (hasContent(state) || state.updatedAt) booted = true;
    if (local.ui) {
      if (TABS.includes(local.ui.tab) && hasContent(state)) ui.tab = local.ui.tab;
      if (["all", "H", "F"].includes(local.ui.rank)) ui.rank = local.ui.rank;
      if (local.ui.sex === "F") ui.sex = "F";
    }
  }
  if (hotData && typeof hotData === "object") {
    if (TABS.includes(hotData.tab)) ui.tab = hotData.tab;
    if (["all", "H", "F"].includes(hotData.rank)) ui.rank = hotData.rank;
    if (Number.isInteger(hotData.round)) ui.round = hotData.round;
  }
  render();
  connect();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === "function") {
  try { hot.snapshot(() => ({ tab: ui.tab, rank: ui.rank, round: ui.round })); } catch (e) { /* rien */ }
}
if (hot && typeof hot.ready === "function") hot.ready(boot);
else boot((hot && hot.data) || {});
})();

<script>
/* Appli autonome : le service worker garde la page et les polices pour un usage hors ligne.
   Sans effet sur claude.ai (ce bloc n'y est pas publié), en file:// et en http hors localhost. */
(function () {
  "use strict";
  if (!("serviceWorker" in navigator) || !window.isSecureContext || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js")
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) {
        /* Les polices peuvent arriver sans passer par le service worker (première visite, cache du navigateur) :
           on lui donne l'adresse de leurs feuilles de style pour qu'il les garde, avec leurs fichiers */
        var urls = [].map.call(document.querySelectorAll('link[rel="stylesheet"]'), function (l) { return l.href; })
          .filter(function (u) { return /^https:\/\/fonts\.googleapis\.com\//.test(u); });
        if (urls.length && reg.active) reg.active.postMessage({ type: "polices", urls: urls });
      })
      .catch(function () { /* navigation privée ou stockage refusé : l'appli marche quand même */ });
    /* Appli installée : demander au navigateur de ne pas effacer le tournoi enregistré sur l'appareil */
    var installed = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    if (installed && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* rien */ });
  });
})();
</script>
